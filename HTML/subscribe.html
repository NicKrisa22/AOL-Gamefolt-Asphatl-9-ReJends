<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/subscribe.css">
    <link rel="icon" type="image/png" href="/Asset/gamefolt.png">
    <title>Gamefolt</title>
</head>
<body>
    <nav>
        <label class = "logo-asptpahlt">Gamefolt</label>
        <ul>
            <li><a href="mainpage.html">HOME</a></li>
            <li><a href="gallery.html">GALLERY</a></li>
            <li><a href="news.html">NEWS</a></li>
            <li><a href="event.html">EVENT</a></li>
            <li><a href="subscribe.html">SUBSCRIBE</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="boxform">
            <div class="formbox">
                <div class="buttbox">
                    <div id="loveee"></div>
                    <button type="button" class="toggle" onclick="login()">Log-In</button>
                    <button type="button" class="toggle" onclick="register()">Register</button>
                </div>
                <form id="login" class="input-group" onsubmit="return validatelogin()">
                    <input type="name" class="input-field" placeholder="Enter your name" required>
                    <input type="email" class="input-field" placeholder="Enter Email" required>
                    <input type="checkbox" class="check-box"><span>Remember Account</span>
                    <button type="submit" class="submit-love">Log-In</button>
                </form>

                <form id="register" class="input-group" onsubmit="return validateregis()">
                    <input type="name" class="input-field" placeholder="Enter your name" required>
                    <input type="email" class="input-field" placeholder="E-mail" required>
                    <input type="date" class="input-field" placeholder="Date of Birth" required>
                    <div class="input-field-gender" required>
                        <label>
                            <input type="radio" name="gender" value="male" required> Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="female" required> Female
                        </label>
                    </div>
                    <input type="checkbox" class="check-box"><span>I agree to the terms & condition</span>
                    <button type="submit" class="submit-love">Register</button>
                </form>
            </div>
        </div>
    </main>

    <script src="/JS/back.js"> </script>
</body>
</html>
